name: sec-android-module
on:
  pull_request:
    paths:
      - 'security/**'
      - 'shared-crypto/**'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - run: gradle :security:testDebugUnitTest :security:lintDebug
