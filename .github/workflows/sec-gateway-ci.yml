name: sec-gateway-ci
on:
  pull_request:
    paths:
      - 'security-gateway/**'
      - 'shared-crypto/**'
      - 'enclave/**'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - run: gradle test
        working-directory: security-gateway
