name: sec-authz-model-test
on:
  push:
    branches:
      - master
      - main
    paths:
      - 'authz/**'
  pull_request:
    branches:
      - master
      - main
    paths:
      - 'authz/**'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: OpenFGA model tests
        run: docker run --rm -v "$PWD/authz:/w" -w /w openfga/cli:v0.8.2 model test --tests model.fga.yaml
