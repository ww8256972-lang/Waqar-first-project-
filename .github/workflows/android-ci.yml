name: Android CI — Waqar Computer Institute

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8 -Djava.awt.headless=true"

jobs:
  build-and-test:
    name: Build, Lint, Test & Package Debug + Release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Set up compatible JDK (Temurin 21 for AGP 9.1.1 & Gradle 9.3.1)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 3. Configure Android SDK (Explicitly override default 'packages: tools platform-tools' to prevent obsolete 'tools' package failure)
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: 'cmdline-tools;latest platform-tools'
          accept-android-sdk-licenses: true

      # 4 & 5. Accept Android SDK licenses & install required SDK platforms and build-tools
      - name: Accept SDK Licenses & Install Required Android SDK Packages
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(which sdkmanager)"
          fi
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-36" \
            "platforms;android-36.1" \
            "build-tools;36.0.0"

      # 6. Validate Gradle Wrapper & Prepare Debug + Release Signing Keystores
      - name: Validate Gradle Wrapper & Prepare Signing Keystores
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "Verified gradle-wrapper.properties:"
            cat gradle/wrapper/gradle-wrapper.properties
          fi
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          fi
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=${RELEASE_STORE_PASSWORD}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${RELEASE_KEY_PASSWORD}" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -storepass waqar_release_pass \
              -alias upload \
              -keypass waqar_release_pass \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Waqar Computer Institute,OU=ERP,O=WCI,L=Lucknow,S=UP,C=IN"
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=waqar_release_pass" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=waqar_release_pass" >> "$GITHUB_ENV"
          fi
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      # 7. Set up Gradle 9.3.1 with build caching
      - name: Set up Gradle 9.3.1 with Caching
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false

      # 8. Validate Gradle project configuration
      - name: Validate Project Configuration
        run: |
          gradle help --stacktrace

      # 9. Run KSP & Kotlin compilation (with explicit compiler error diagnostics)
      - name: Compile Debug Kotlin Sources
        run: |
          set -o pipefail
          gradle :app:kspDebugKotlin :app:compileDebugKotlin --stacktrace 2>&1 | tee kotlin-compile.log || {
            echo "=== FIRST KOTLIN / KSP COMPILER ERRORS ==="
            grep -E "^e: |Unresolved reference|Type mismatch|Cannot find symbol|Exception in thread|OutOfMemoryError" kotlin-compile.log || true
            exit 1
          }

      # 10. Run Android Lint check
      - name: Run Android Lint
        run: |
          gradle :app:lintDebug --stacktrace

      # 11. Run Unit Tests
      - name: Run Unit Tests
        run: |
          gradle :app:testDebugUnitTest \
            --tests "com.example.ExampleUnitTest" \
            --tests "com.example.RemediationVerificationTest" \
            --stacktrace

      # 12. Assemble Debug APK & Signed Release APK
      - name: Assemble Debug APK
        run: |
          gradle :app:assembleDebug :app:assembleRelease --stacktrace

      # 13. Verify Debug & Release APKs exist on disk
      - name: Verify Generated Debug APK Exists
        run: |
          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$DEBUG_APK" ]; then
            echo "ERROR: Expected Debug APK not found at $DEBUG_APK"
            exit 1
          fi
          if [ ! -f "$RELEASE_APK" ]; then
            echo "ERROR: Expected Release APK not found at $RELEASE_APK"
            exit 1
          fi
          ls -lh "$DEBUG_APK" "$RELEASE_APK"

      # 14. Upload Debug APK Artifact
      - name: Upload Debug APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: waqar-institute-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # 15. Upload Signed Release APK Artifact
      - name: Upload Release APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: waqar-institute-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
